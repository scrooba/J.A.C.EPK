<section class="panel content" id="radio-hub">
    <p class="kicker">Radio Transmission Hub</p>
    <h2>Broadcast-Ready Downloads</h2>
    <p class="lead">Select a track to preview. Download high-res files for immediate airplay.</p>

    <div class="list" style="margin-top: 2rem;">
        <div class="list-item track-row">
            <div class="track-identity">
                <button class="inline-play-btn" onclick="togglePlay('audio-loop', this)" aria-label="Preview Track">
                    <i class="ri-play-circle-fill"></i>
                </button>
                <div class="track-info">
                    <strong class="focus-label">Focus Track</strong>
                    <span class="track-title">Loop_of_you</span>
                    <audio id="audio-loop" src="assets/audio/J.A.C_Loop_of_you.mp3"></audio>
                </div>
            </div>
            <div class="track-actions">
                <span class="track-meta">124 BPM | G Minor</span>
                <div class="dl-group">
                    <a href="assets/audio/J.A.C_Loop_of_you_Clean.wav" download class="dl-btn">.WAV</a>
                    <a href="assets/audio/J.A.C_Loop_of_you_320.mp3" download class="dl-btn">.MP3</a>
                </div>
            </div>
        </div>

        <div class="list-item track-row">
            <div class="track-identity">
                <button class="inline-play-btn" onclick="togglePlay('audio-pressure', this)" aria-label="Preview Track">
                    <i class="ri-play-circle-fill"></i>
                </button>
                <div class="track-info">
                    <strong>Set Opener</strong>
                    <span class="track-title">Pressure_on_me</span>
                    <audio id="audio-pressure" src="assets/audio/J.A.C_Pressure_on_me.mp3"></audio>
                </div>
            </div>
            <div class="track-actions">
                <span class="track-meta">126 BPM | C Major</span>
                <div class="dl-group">
                    <a href="assets/audio/J.A.C_Pressure_on_me_Clean.wav" download class="dl-btn">.WAV</a>
                    <a href="assets/audio/J.A.C_Pressure_on_me_320.mp3" download class="dl-btn">.MP3</a>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
    /* Radio Hub UX Styles */
    .track-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.25rem 0;
        gap: 1.5rem;
    }
    
    .track-identity { display: flex; align-items: center; gap: 1rem; }
    
    .inline-play-btn {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        color: var(--primary);
        font-size: 2.2rem;
        display: flex;
        align-items: center;
        transition: transform 0.2s ease;
    }
    .inline-play-btn:hover { transform: scale(1.1); }
    
    .track-title {
        font-family: var(--display);
        font-size: 1.3rem;
        font-weight: 700;
        display: block;
    }
    
    .focus-label { color: var(--primary); font-size: 0.7rem; letter-spacing: 0.1em; }
    
    .track-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }
    .track-meta { font-size: 0.75rem; color: var(--faint); font-weight: 700; }
    
    .dl-group { display: flex; gap: 0.5rem; }
    .dl-btn {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.4rem 0.8rem;
        border-radius: 6px;
        font-size: 0.7rem;
        font-weight: 800;
        text-decoration: none;
    }
    .dl-btn:hover { border-color: var(--primary); background: rgba(239, 125, 77, 0.1); }

    @media (max-width: 600px) {
        .track-row { flex-direction: column; align-items: flex-start; }
        .track-actions { align-items: flex-start; }
    }
</style>

<script>
    function togglePlay(id, btn) {
        const audio = document.getElementById(id);
        const icon = btn.querySelector('i');
        const allAudios = document.querySelectorAll('audio');
        const allIcons = document.querySelectorAll('.inline-play-btn i');

        if (audio.paused) {
            // Pause everything else
            allAudios.forEach(a => a.pause());
            allIcons.forEach(i => { i.className = 'ri-play-circle-fill'; });
            
            audio.play();
            icon.className = 'ri-pause-circle-fill';
        } else {
            audio.pause();
            icon.className = 'ri-play-circle-fill';
        }
    }
</script>
